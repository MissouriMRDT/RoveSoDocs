name: Build & Deploy Docs Hub

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docs hub
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # -------------------------
      # Build VitePress (root site)
      # -------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node deps
        run: npm ci

      - name: Build VitePress into dist/
        run: |
          npm run docs:build
          mkdir -p dist
          rsync -a .vitepress/dist/ dist/

      # -------------------------
      # Build RoveSoSimulator (Jekyll)
      # -------------------------
      - name: Checkout RoveSoSimulator (Jekyll)
        uses: actions/checkout@v4
        with:
          repository: MissouriMRDT/RoveSoSimulator
          ref: github-pages
          path: src/RoveSoSimulator
          fetch-depth: 1
          token: ${{ secrets.DOCS_BOT_TOKEN || github.token }}

      - name: Setup Ruby (for Jekyll) - no cache
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.4"
          bundler-cache: false
          working-directory: src/RoveSoSimulator

      - name: Install gems (fresh, no cache)
        working-directory: src/RoveSoSimulator
        env:
          BUNDLE_WITHOUT: "development:test"
        run: |
          set -euo pipefail

          # Ensure nothing from a previous run is reused
          rm -rf .bundle vendor/bundle Gemfile.lock

          gem --version
          bundler --version || gem install bundler

          # Force a clean, local install each run (no shared cache)
          bundle config set --local path 'vendor/bundle'
          bundle config set --local clean 'true'
          bundle config set --local without 'development:test'

          bundle install --jobs 4 --retry 3

      - name: Build RoveSoSimulator site
        working-directory: src/RoveSoSimulator
        env:
          JEKYLL_ENV: production
          PAGES_REPO_NWO: MissouriMRDT/RoveSoSimulator
          JEKYLL_GITHUB_TOKEN: ${{ secrets.DOCS_BOT_TOKEN || github.token }}
        run: |
          bundle exec jekyll build \
            --baseurl "/RoveSoSimulator" \
            -d "$GITHUB_WORKSPACE/dist/RoveSoSimulator"

      # -------------------------
      # Build Autonomy_Software (Doxygen)
      # -------------------------
      - name: Checkout Autonomy_Software (Doxygen)
        uses: actions/checkout@v4
        with:
          repository: MissouriMRDT/Autonomy_Software
          path: src/Autonomy_Software
          fetch-depth: 1
          submodules: recursive
          token: ${{ secrets.DOCS_BOT_TOKEN || github.token }}

      - name: Install Doxygen + Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz rsync

      - name: Run Doxygen
        working-directory: src/Autonomy_Software
        run: |
          doxygen ./Doxyfile

      - name: Stage Autonomy docs into hub dist
        run: |
          set -euo pipefail
          mkdir -p dist/autonomy

          if [ -d "src/Autonomy_Software/docs/Doxygen/html" ]; then
            rsync -a "src/Autonomy_Software/docs/Doxygen/html/" "dist/autonomy/"
          elif [ -d "src/Autonomy_Software/docs/Doxygen" ]; then
            rsync -a "src/Autonomy_Software/docs/Doxygen/" "dist/autonomy/"
          elif [ -d "src/Autonomy_Software/html" ]; then
            rsync -a "src/Autonomy_Software/html/" "dist/autonomy/"
          else
            echo "ERROR: Could not find Doxygen HTML output folder."
            exit 1
          fi

      - name: Disable Jekyll processing for the published site
        run: |
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
